<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Velocity Cycles</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/706/706201.png">
</head>
<body>
  <div class="admin-toast-container" id="toast-container"></div>

  <div class="admin-login-layout">
    <div class="admin-login-card">
      <!-- Logo -->
      <div class="admin-login-header">
        <div class="admin-login-logo">
          <div class="sidebar-logo-icon" style="width:48px;height:48px;font-size:24px"><i class="fas fa-bicycle"></i></div>
          <div>
            <div style="font-family:'Montserrat',sans-serif;font-size:20px;font-weight:900;color:#fff">VELOCITY<span style="color:#39ff14">CYCLES</span></div>
          </div>
        </div>
        <h1 class="admin-login-title">Admin Panel</h1>
        <p class="admin-login-subtitle">Sign in to manage your store</p>
      </div>

      <!-- Form -->
      <form class="admin-login-form" id="admin-login-form" onsubmit="handleAdminLoginSubmit(event)">
        <div class="admin-form-group">
          <label class="admin-label">Email Address</label>
          <div style="position:relative">
            <i class="fas fa-envelope" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,0.3);font-size:14px"></i>
            <input type="email" id="admin-email" class="admin-input" placeholder="admin@velocitycycles.com" style="padding-left:38px" required>
          </div>
        </div>
        <div class="admin-form-group">
          <label class="admin-label">Password</label>
          <div style="position:relative">
            <i class="fas fa-lock" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,0.3);font-size:14px"></i>
            <input type="password" id="admin-password" class="admin-input" placeholder="Enter your password" style="padding-left:38px;padding-right:44px" required>
            <button type="button" onclick="toggleAdminPw()" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:rgba(255,255,255,0.4);cursor:pointer;font-size:16px" id="pw-toggle-btn">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:rgba(255,255,255,0.5)">
            <input type="checkbox" style="accent-color:#39ff14"> Remember me
          </label>
          <a href="#" style="font-size:13px;color:rgba(57,255,20,0.7)">Forgot password?</a>
        </div>
        <button type="submit" class="admin-btn admin-btn-primary" style="width:100%;justify-content:center;padding:12px;font-size:14px">
          <i class="fas fa-sign-in-alt"></i> Sign In to Dashboard
        </button>
      </form>

      <!-- Demo Credentials -->
      <div style="background:rgba(57,255,20,0.06);border:1px solid rgba(57,255,20,0.15);border-radius:8px;padding:14px;margin-top:24px">
        <div style="font-size:12px;font-weight:700;color:rgba(255,255,255,0.6);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px">
          <i class="fas fa-info-circle" style="color:#39ff14"></i> Demo Credentials
        </div>
        <div style="display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:12px">
          <span style="color:rgba(255,255,255,0.4)">Email:</span>
          <span style="color:#39ff14;font-weight:600;cursor:pointer" onclick="document.getElementById('admin-email').value=this.textContent">admin@velocitycycles.com</span>
          <span style="color:rgba(255,255,255,0.4)">Password:</span>
          <span style="color:#39ff14;font-weight:600;cursor:pointer" onclick="document.getElementById('admin-password').value=this.textContent">admin123</span>
        </div>
        <div style="font-size:11px;color:rgba(255,255,255,0.3);margin-top:8px">Click values above to auto-fill</div>
      </div>

      <div style="text-align:center;margin-top:24px">
        <a href="../index.html" style="font-size:13px;color:rgba(255,255,255,0.3);display:inline-flex;align-items:center;gap:6px">
          <i class="fas fa-arrow-left"></i> Back to Main Website
        </a>
      </div>
    </div>
  </div>

  <script src="../assets/js/products.js"></script>
  <script src="../assets/js/cart.js"></script>
  <script src="../assets/js/wishlist.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/orders.js"></script>
  <script src="../assets/js/cloudinary.js"></script>
  <script src="../assets/js/admin.js"></script>
  <script>
    function handleAdminLoginSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('admin-email').value;
      const password = document.getElementById('admin-password').value;
      const result = AuthStore.adminLogin(email, password);
      if (result.success) {
        showAdminToast('Welcome Back!', 'Redirecting to dashboard...', 'success');
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 800);
      } else {
        showAdminToast('Access Denied', result.message || 'Invalid credentials.', 'error');
      }
    }

    function toggleAdminPw() {
      const input = document.getElementById('admin-password');
      const btn = document.getElementById('pw-toggle-btn');
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = '<i class="fas fa-eye-slash"></i>';
      } else {
        input.type = 'password';
        btn.innerHTML = '<i class="fas fa-eye"></i>';
      }
    }

    // Redirect if already logged in
    if (AuthStore.isAdminLoggedIn()) {
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
